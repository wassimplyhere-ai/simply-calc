<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    --bg: #e4e8e2;
    --case: #cfd6ce;
    --key: #f6f8f4;
    --key-fn: #b9c3b9;
    --ink: #1c2421;
    --muted: #56635d;
    --op: #d9891c;
    --op-ink: #1d1505;
    --lcd: #b6c8af;
    --lcd-ink: #12201a;
    --focus: #1c2421;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15191c;
      --case: #22282d;
      --key: #2c343a;
      --key-fn: #3a444c;
      --ink: #e9ecea;
      --muted: #97a39e;
      --op: #e6a23c;
      --op-ink: #1e1606;
      --lcd: #b6c8af;
      --lcd-ink: #12201a;
      --focus: #e9ecea;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15191c;
    --case: #22282d;
    --key: #2c343a;
    --key-fn: #3a444c;
    --ink: #e9ecea;
    --muted: #97a39e;
    --op: #e6a23c;
    --op-ink: #1e1606;
    --lcd: #b6c8af;
    --lcd-ink: #12201a;
    --focus: #e9ecea;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  main {
    display: grid;
    justify-items: center;
    gap: 16px;
  }

  .calc {
    width: min(92vw, 344px);
    background: var(--case);
    border-radius: 32px;
    padding: 20px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      0 24px 48px -24px rgba(0, 0, 0, 0.45);
  }

  .lcd {
    background: var(--lcd);
    color: var(--lcd-ink);
    border-radius: 18px;
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    min-height: 128px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.28);
    overflow: hidden;
  }

  .expr {
    font-size: 0.9rem;
    min-height: 1.3em;
    max-width: 100%;
    opacity: 0.72;
    text-align: right;
    overflow-wrap: anywhere;
  }

  .result {
    font-size: 3.6rem;
    line-height: 1.1;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
  }

  .result.long { font-size: 2.6rem; }
  .result.xlong { font-size: 1.9rem; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    font: inherit;
    font-size: 1.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    height: 4.25rem;
    border: 0;
    border-radius: 16px;
    background: var(--key);
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }

  button:hover { filter: brightness(1.04); }
  button.fn { background: var(--key-fn); }
  button.op { background: var(--op); color: var(--op-ink); }

  button:active,
  button.pressed {
    transform: translateY(2px);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
  }

  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .hint {
    margin: 0;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="calc" aria-label="Calculator">
    <div class="lcd">
      <div class="expr" id="expr"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="fn" data-action="clear" data-key="Escape" aria-label="All clear">AC</button>
      <button class="fn" data-action="back" data-key="Backspace" aria-label="Delete last digit">⌫</button>
      <button class="fn" data-action="percent" data-key="%" aria-label="Percent">%</button>
      <button class="op" data-action="op" data-value="/" data-key="/" aria-label="Divide">÷</button>

      <button data-action="digit" data-value="7" data-key="7">7</button>
      <button data-action="digit" data-value="8" data-key="8">8</button>
      <button data-action="digit" data-value="9" data-key="9">9</button>
      <button class="op" data-action="op" data-value="*" data-key="*" aria-label="Multiply">×</button>

      <button data-action="digit" data-value="4" data-key="4">4</button>
      <button data-action="digit" data-value="5" data-key="5">5</button>
      <button data-action="digit" data-value="6" data-key="6">6</button>
      <button class="op" data-action="op" data-value="-" data-key="-" aria-label="Subtract">−</button>

      <button data-action="digit" data-value="1" data-key="1">1</button>
      <button data-action="digit" data-value="2" data-key="2">2</button>
      <button data-action="digit" data-value="3" data-key="3">3</button>
      <button class="op" data-action="op" data-value="+" data-key="+" aria-label="Add">+</button>

      <button class="fn" data-action="sign" aria-label="Change sign">±</button>
      <button data-action="digit" data-value="0" data-key="0">0</button>
      <button data-action="decimal" data-key="." aria-label="Decimal point">.</button>
      <button class="op" data-action="equals" data-key="=" aria-label="Equals">=</button>
    </div>
  </section>

  <p class="hint">Works with your keyboard too.</p>
</main>

<script>
(() => {
  const resultEl = document.getElementById("result");
  const exprEl = document.getElementById("expr");
  const MAX_DIGITS = 12;
  const SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  let current = "0";   // text shown on the display
  let prev = null;     // left-hand operand waiting for an operator
  let op = null;       // pending operator: + - * /
  let fresh = false;   // true when the next digit starts a new number
  let error = null;    // error message, or null

  const countDigits = (s) => s.replace(/[-.]/g, "").length;
  const isExponent = (s) => s.includes("e");

  // Round away floating-point noise (0.1 + 0.2 -> 0.3) and switch to
  // exponent notation for very large or very small numbers.
  function format(n) {
    const r = parseFloat(n.toPrecision(12));
    if (r !== 0 && (Math.abs(r) >= 1e12 || Math.abs(r) < 1e-7)) {
      return r.toExponential(11).replace(/\.?0+e/, "e");
    }
    return String(r);
  }

  function apply(a, o, b) {
    if (o === "/" && b === 0) return { error: "Can't divide by zero" };
    const r = o === "+" ? a + b : o === "-" ? a - b : o === "*" ? a * b : a / b;
    if (!Number.isFinite(r)) return { error: "Result is too large" };
    return { value: r };
  }

  function inputDigit(d) {
    if (fresh) { current = d; fresh = false; return; }
    if (isExponent(current)) return;
    if (current === "0") { current = d; return; }
    if (countDigits(current) < MAX_DIGITS) current += d;
  }

  function inputDecimal() {
    if (fresh) { current = "0."; fresh = false; return; }
    if (isExponent(current) || current.includes(".")) return;
    current += ".";
  }

  function backspace() {
    if (fresh) return;
    current = (isExponent(current) || /^-?.$/.test(current)) ? "0" : current.slice(0, -1);
  }

  function toggleSign() {
    if (current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
  }

  function percent() {
    current = format(parseFloat(current) / 100);
    fresh = false;
  }

  function setOperator(next) {
    const value = parseFloat(current);
    if (op && !fresh) {
      const res = apply(prev, op, value);
      if (res.error) { error = res.error; return; }
      prev = res.value;
      current = format(res.value);
    } else if (prev === null) {
      prev = value;
    }
    op = next;
    fresh = true;
  }

  function equals() {
    if (!op) return;
    const res = apply(prev, op, parseFloat(current));
    if (res.error) { error = res.error; return; }
    current = format(res.value);
    prev = null;
    op = null;
    fresh = true;
  }

  function clearAll() {
    current = "0";
    prev = null;
    op = null;
    fresh = false;
    error = null;
  }

  function render() {
    if (error) {
      resultEl.textContent = "Error";
      resultEl.className = "result";
      exprEl.textContent = `${error}. Press AC to reset.`;
      return;
    }
    resultEl.textContent = current;
    resultEl.className = "result" +
      (current.length > 10 ? " xlong" : current.length > 7 ? " long" : "");
    exprEl.textContent = op && prev !== null ? `${format(prev)} ${SYMBOL[op]}` : "";
  }

  function press(action, value) {
    if (error) {
      // After an error, only AC and new numbers do anything.
      if (action !== "clear" && action !== "digit" && action !== "decimal") return;
      clearAll();
    }
    switch (action) {
      case "digit":    inputDigit(value); break;
      case "decimal":  inputDecimal(); break;
      case "op":       setOperator(value); break;
      case "equals":   equals(); break;
      case "clear":    clearAll(); break;
      case "back":     backspace(); break;
      case "sign":     toggleSign(); break;
      case "percent":  percent(); break;
    }
    render();
  }

  // Mouse and touch
  document.querySelector(".keys").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (btn) press(btn.dataset.action, btn.dataset.value);
  });

  // Keyboard: map each key to the button it stands for
  const buttonsByKey = new Map();
  document.querySelectorAll("button[data-key]").forEach((b) => buttonsByKey.set(b.dataset.key, b));

  const KEY_ALIASES = { Enter: "=", x: "*", X: "*", ",": ".", c: "Escape", C: "Escape" };

  function flash(btn) {
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 120);
  }

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = KEY_ALIASES[e.key] || e.key;
    const btn = buttonsByKey.get(key);
    if (!btn) return;
    e.preventDefault();
    flash(btn);
    press(btn.dataset.action, btn.dataset.value);
  });

  render();
})();
</script>
</body>
</html>
